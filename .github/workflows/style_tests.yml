name: style_tests

on:
  push:
    paths:
      - .github/workflows/style_tests.yml
      - style_tests/**

jobs:
  tests:
    runs-on: ubuntu-latest
    name: tests
    steps:
      - uses: actions/checkout@master
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
      - name: Run tests
        run: uv run -m unittest --verbose
        working-directory: style_tests
